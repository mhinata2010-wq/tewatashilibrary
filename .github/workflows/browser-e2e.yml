name: Browser E2E
on:
  pull_request:
  workflow_dispatch:
jobs:
  browser-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser
        run: |
          npm install --no-save playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Serve site
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/tewatashi-server.log 2>&1 &
          for i in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:8765/ >/dev/null && exit 0
            sleep 1
          done
          exit 1
      - name: Browser tests (Adobe Fonts required)
        env:
          REQUIRE_ADOBE_FONT: '1'
        run: |
          set -o pipefail
          node tests/browser-e2e.mjs 2>&1 | tee browser-e2e-results.log
      - name: Preserve browser diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-e2e-diagnostics
          path: |
            browser-e2e-results.log
            /tmp/tewatashi-server.log
          if-no-files-found: warn
          retention-days: 14
