name: Browser E2E
on:
  pull_request:
  push:
    branches:
      - feature/tewatashi-integrated-20261113
  workflow_dispatch:
jobs:
  browser-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Record exact checkout SHA and trigger
        run: |
          echo "### Browser E2E provenance" >> "$GITHUB_STEP_SUMMARY"
          echo "- Checked-out commit: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          echo "- GitHub event: $GITHUB_EVENT_NAME" >> "$GITHUB_STEP_SUMMARY"
          echo "- Ref: $GITHUB_REF" >> "$GITHUB_STEP_SUMMARY"
          echo "- Source head SHA: ${{ github.event.pull_request.head.sha || github.sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Workflow run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >> "$GITHUB_STEP_SUMMARY"
          echo "Note: pull_request runs may test a synthetic merge commit rather than the PR head SHA." >> "$GITHUB_STEP_SUMMARY"
          printf "checkout_sha=%s\nevent=%s\nref=%s\nrun_url=%s/%s/actions/runs/%s\nsource_head_sha=%s\n" \
            "$(git rev-parse HEAD)" "$GITHUB_EVENT_NAME" "$GITHUB_REF" \
            "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" \
            "${{ github.event.pull_request.head.sha || github.sha }}" > browser-e2e-provenance.txt
      - name: Install browser
        run: |
          npm install --no-save playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Serve site
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/tewatashi-server.log 2>&1 &
          for i in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:8765/ >/dev/null && exit 0
            sleep 1
          done
          exit 1
      # Functional E2E must remain useful when the external Adobe kit is unavailable.
      # Font loading and real MP4 playback are checked by the separate release gate below.
      - name: Browser tests (functional fallback permitted)
        run: |
          set -o pipefail
          node tests/browser-e2e.mjs 2>&1 | tee browser-e2e-results.log
      - name: Verify and fingerprint visual evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p browser-e2e-screenshots
          : > browser-e2e-screenshot-manifest.txt
          missing=0
          for name in desktop-home desktop-rental mobile-home mobile-rental desktop-hero desktop-video desktop-promises desktop-gallery mobile-hero mobile-video mobile-promises mobile-gallery figma-1920-home figma-1920-home-full figma-1920-hero figma-1920-video figma-1920-promises figma-1920-about-full figma-1920-rental-full; do
            file="browser-e2e-screenshots/${name}.png"
            if [ -s "$file" ]; then
              sha256sum "$file" >> browser-e2e-screenshot-manifest.txt
            else
              echo "MISSING $file" | tee -a browser-e2e-screenshot-manifest.txt
              missing=1
            fi
          done
          echo "### Visual evidence integrity" >> "$GITHUB_STEP_SUMMARY"
          echo "Manifest: browser-e2e-screenshot-manifest.txt" >> "$GITHUB_STEP_SUMMARY"
          if [ "$missing" -ne 0 ]; then
            echo "Screenshot evidence incomplete; this does not prove Figma parity." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "19 required screenshot files exist and have SHA-256 fingerprints. Figma pixel comparison remains separate." >> "$GITHUB_STEP_SUMMARY"
      # The normal E2E accepts an accessible photo fallback. Release readiness must not.
      - name: Official MP4 playback readiness (expected blocker until approved MP4 exists)
        id: playback_readiness
        continue-on-error: true
        env:
          REQUIRE_REAL_MEDIA: '1'
          REQUIRE_ADOBE_FONT: '1'
        run: |
          set -o pipefail
          node tests/browser-e2e.mjs 2>&1 | tee browser-e2e-release-readiness.log
      - name: Publish playback readiness to workflow summary
        if: always()
        env:
          PLAYBACK_OUTCOME: ${{ steps.playback_readiness.outcome }}
        run: |
          if [ "$PLAYBACK_OUTCOME" = "success" ]; then
            echo "### Official MP4 playback readiness: PASS" >> "$GITHUB_STEP_SUMMARY"
            echo "release_readiness=pass" > browser-e2e-release-status.txt
            echo "Strict browser checks passed; publication rights and source authenticity still require separate approval." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Official MP4 playback readiness: BLOCKED ($PLAYBACK_OUTCOME)" >> "$GITHUB_STEP_SUMMARY"
            echo "release_readiness=blocked" > browser-e2e-release-status.txt
            echo "Strict browser playback or font verification failed. Normal fallback E2E is not release approval." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Preserve browser diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-e2e-diagnostics
          path: |
            browser-e2e-provenance.txt
            browser-e2e-screenshot-manifest.txt
            browser-e2e-release-status.txt
            browser-e2e-results.log
            browser-e2e-release-readiness.log
            browser-e2e-screenshots/*.png
            /tmp/tewatashi-server.log
          if-no-files-found: warn
          # Keep Figma comparison evidence available across review cycles.
          retention-days: 30
